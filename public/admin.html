<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10131c"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/assets/app-icon.svg" type="image/svg+xml"><title>مدیریت سناریو | کاسپین</title><link rel="stylesheet" href="/style.css"></head><body><main class="shell"><header><div class="brand">CASPIAN <span>مدیریت سناریو</span></div></header><section class="panel"><h1>ترکیب ۱۶ نقش</h1><p id="status">در حال دریافت تنظیمات...</p><label>نام سناریو<input id="scenarioName"></label><div class="split"><label>پدرخوانده<input id="پدرخوانده" type="number" min="0" max="16"></label><label>دکتر لکتر<input id="دکتر لکتر" type="number" min="0" max="16"></label></div><div class="split"><label>مافیا<input id="مافیا" type="number" min="0" max="16"></label><label>کارآگاه<input id="کارآگاه" type="number" min="0" max="16"></label></div><div class="split"><label>پزشک<input id="پزشک" type="number" min="0" max="16"></label><label>شهروند<input id="شهروند" type="number" min="0" max="16"></label></div><div class="split"><label>قاتل زنجیره‌ای<input id="قاتل زنجیره‌ای" type="number" min="0" max="16"></label><label>مستقل<input id="مستقل" type="number" min="0" max="16"></label></div><p id="total">مجموع: ۱۶</p><label>استعلام کارآگاه<select id="investigatorResult"><option value="alignment">مافیا یا شهروند (با اختیار پدرخوانده)</option></select></label><label>استعلام مستقل<select id="independentInvestigation"><option value="nonmafia">مافیا / غیرمافیا</option><option value="exact">نمایش نقش دقیق</option></select></label><label>تساوی رأی مافیا<select id="mafiaTieBreak"><option value="godfather">اختیار پدرخوانده</option><option value="random">بدون اختیار ویژه</option></select></label><label>شرط برد مافیا<select id="mafiaWin"><option value="parity">رسیدن به برابری عددی</option><option value="elimination">حذف کامل شهروندان</option></select></label><label>شرط برد قاتل زنجیره‌ای<select id="serialKillerWin"><option value="alive">تنها بازمانده بودن</option></select></label><button id="save">ذخیره سناریو</button> <a class="adminLink" href="/">بازگشت به بازی</a></section></main><script src="/admin.js"></script><script src="/pwa.js"></script></body></html>
