name: CASPIAN online tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check online server syntax
        run: node --check server.js && node --check rules-engine.js && node --check scenario-runtime.js && node --check platform.js && node --check persistence.js && node --check birthday-api.js && node --check public/app.js && node -e "const fs=require('fs');const h=fs.readFileSync('public/birthday-room.html','utf8');const m=h.match(/<script>([\\s\\S]*?)<\\/script>/);if(!m)throw new Error('birthday inline script missing');new Function(m[1]);"
      - name: Run online game tests
        run: npm test
