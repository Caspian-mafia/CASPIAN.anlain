name: CASPIAN Android compile check
on:
  push:
    branches: [main]
    paths:
      - 'android-native/**'
      - '.github/workflows/android-compile-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android-native/**'
      - '.github/workflows/android-compile-check.yml'
permissions:
  contents: read
jobs:
  compile-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Android shell only (no APK artifact)
        working-directory: android-native
        run: gradle --no-daemon clean assembleDebug -PCASPIAN_SERVER_URL=https://caspian.invalid
